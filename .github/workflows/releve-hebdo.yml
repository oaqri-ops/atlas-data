name: Relevé hebdomadaire

# Chaque lundi : nouvelles annonces depuis l'actor Apify, pages villes et quartiers régénérées,
# puis publication sur la branche main (GitHub Pages redéploie le site).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releve-hebdo
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Relever les annonces sur Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_apify.py

      - name: Régénérer les pages
        run: python scripts/build_site.py

      - name: Publier
        run: |
          git config user.name "atlas-data-bot"
          git config user.email "atlas-data-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Relevé du $(date -u +%Y-%m-%d)"
            git push
          fi
